name: api-ci

# `15-infra-and-ops.md` §3. The required checks for merge are ruff, mypy,
# import-linter, pytest, the coverage gates and spec traceability; everything
# else reports without blocking, "so a flaky Lighthouse run never blocks a fix".
#
# This workflow is also where anything needing a container is verified. The
# development machine has no Docker - virtualization is disabled by policy - so
# `make up`, the Mongo/Redis service containers and the image audit run here
# rather than locally. Steps that need code which does not exist yet are added
# by the requirement that produces them, not stubbed in advance.

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level, so no step can be missing them.
#
# Three steps build a `Settings` - `pytest`, and `generate`'s
# `export_openapi.py`, which calls `create_app()`. Only `pytest` had an `env`
# block, so `generated artifacts are current` failed on a `ValidationError` for
# required settings that have no defaults (`AC-FOUND-02.1`, deliberately: a
# missing required setting fails the boot rather than defaulting to something
# insecure). `.env` is gitignored, so CI has to supply them.
#
# Every value is a throwaway and nothing reaches a real service:
# `AI_PROVIDER_DEFAULT` is `fake`, mail is blocked at import by
# `conftest._block_outbound_mail`, and `real_ai`/`real_source` are deselected
# by `pytest.ini`.
env:
  UV_SYSTEM_CERTS: "1"
  APP_ENV: local
  PRODUCT_NAME: JobPilot
  API_BASE_URL: http://localhost:8000
  WEB_ORIGIN: http://localhost:5173
  SECRET_KEY: ci-secret-key-at-least-thirty-two-chars
  REFRESH_PEPPER: ci-refresh-pepper-at-least-thirty-two-chars
  JWT_PRIVATE_KEY_PEM: ci
  JWT_PUBLIC_KEY_PEM: ci
  JWT_ISSUER: jobpilot
  JWT_AUDIENCE: jobpilot
  MONGODB_URI: mongodb://localhost:27017
  MONGODB_DB: jobpilot
  REDIS_URL: redis://localhost:6379/0
  R2_ACCOUNT_ID: ci
  R2_ACCESS_KEY_ID: ci
  R2_SECRET_ACCESS_KEY: ci
  R2_BUCKET: ci
  R2_PUBLIC_BASE_URL: http://localhost:9000
  CONNECTOR_USER_AGENT: JobPilot/1.0 (+http://localhost/about)
  EMAIL_FROM: no-reply@localhost
  EMAIL_PROVIDER: mailpit
  METRICS_TOKEN: ci
  AI_PROVIDER_DEFAULT: fake
  AI_EMBEDDING_PROVIDER: fake

jobs:
  checks:
    name: lint, types, contracts, tests
    runs-on: ubuntu-latest
    timeout-minutes: 12  # AC-OPS-03.6: a full run completes in under 12 minutes

    # `tests/conftest.py`: "The connection comes from `MONGODB_URI`: the
    # repository's `.env` locally, **a service container in CI**." That sentence
    # described an intention rather than this file - there was no container, so
    # every integration test would have failed the moment `ruff` stopped failing
    # first.
    #
    # A real MongoDB and not a substitute, because `DATA-03` and `DATA-05`
    # assert Mongo's own index, TTL and partial-filter behaviour and nothing
    # in-memory shares it. `mongo:8` matches Atlas's major version.
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python and dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: ruff
        working-directory: apps/api
        run: uv run ruff check ../../apps/api ../../infra/scripts

      - name: ruff format
        working-directory: apps/api
        run: uv run ruff format --check ../../apps/api ../../infra/scripts

      # T-FOUND-04.1 - `AC-FOUND-04.1`: all contracts active, zero exemptions.
      - name: import-linter
        working-directory: apps/api
        run: uv run lint-imports --config .importlinter

      - name: mypy
        working-directory: apps/api
        run: uv run mypy

      - name: pytest
        working-directory: apps/api
        # The failure summary is written to the step summary and emitted as
        # annotations, not left in the log. This repository is public and its
        # Actions logs are not: `/logs` answers 403 to an anonymous request, so
        # a red build said only "Process completed with exit code 1" to anyone
        # without push access - including the tooling that has to fix it.
        # Annotations and the step summary are readable; the log is not.
        run: |
          set -o pipefail
          if uv run pytest --tb=short 2>&1 | tee "$RUNNER_TEMP/pytest.txt"; then
            # The count, as a notice annotation on every green run. "Green" and
            # "green, and it ran 1898 tests" are different claims, and only the
            # second one rules out a suite that collected almost nothing -
            # which is the failure a passing build cannot show you.
            summary=$(grep -E '^[0-9]+ (passed|failed)|passed|no tests ran'               "$RUNNER_TEMP/pytest.txt" | tail -1)
            echo "::notice title=pytest::${summary}"
            echo "pytest: ${summary}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### pytest failed"
            echo ''
            echo '```'
            tail -c 20000 "$RUNNER_TEMP/pytest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAILED|ERROR)' "$RUNNER_TEMP/pytest.txt" | head -40 | while read -r line; do
            echo "::error title=pytest::${line}"
          done
          exit 1

      # T-AI-07.2 - `AC-AI-07.2`: editing a prompt whose version has already run
      # in production fails CI with a message to create the next version.
      #
      # Its own step rather than a pytest case so the failure is legible in the
      # checks list: the thing to do about it is "create v<N+1>", and that
      # instruction should be the first line someone reads, not the tail of a
      # test summary. Checked against the committed manifest
      # (packages/contracts/prompts-in-production.json) because CI has no
      # production credential and should not be given one.
      - name: prompt-immutability
        run: uv run --project apps/api python infra/scripts/check_prompt_immutability.py

      # T-FOUND-06.1 - the traceability gate, and the closure checks.
      - name: spec gates
        run: uv run --project apps/api python -m specgate check
        env:
          PYTHONPATH: infra/scripts

      # Every committed generated artifact must match what the generator
      # produces: BUILD-ORDER.md, status.yaml, TRACEABILITY.md,
      # SPEC-METADATA.json, docs/error-codes.md and .importlinter.
      - name: generated artifacts are current
        run: |
          uv run --project apps/api python infra/scripts/tasks.py generate
          if git diff --exit-code; then
            exit 0
          fi
          {
            echo "### a generated artifact is stale"
            echo ''
            echo '```'
            git diff --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only | while read -r file; do
            echo "::error title=stale artifact::${file}"
          done
          echo "::error::run 'py infra/scripts/tasks.py generate' and commit the result"
          exit 1
