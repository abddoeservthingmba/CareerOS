[project]
name = "jobpilot-api"
version = "0.1.0"
description = "JobPilot API and worker — one image, two entrypoints (ADR-002)."
requires-python = "==3.12.*"
dependencies = [
    "beanie>=1.27",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # `FOUND-08` §8: "Stored in Redis with a 24 h TTL". The atomic claim is
    # `SET key value NX PX ttl`, which is the entire concurrency argument.
    "redis>=5.2",
    "uvicorn[standard]>=0.32",
]

# Product dependencies are added by the requirement that needs them, never
# speculatively (`01-foundations.md` §1). The spec gates in `tests/spec/` import
# no product code and no third-party library beyond pytest, so they run before
# any of it exists.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "pytest-asyncio>=0.24",
    # Starlette's TestClient is an httpx transport; without it every route test
    # would have to drive ASGI by hand. Starlette now prefers `httpx2` and warns
    # on `httpx`; `httpx` is the one FastAPI documents and the one with a long
    # history, so the deprecation warning is the cheaper of the two risks until
    # `httpx2` is the established name.
    "httpx>=0.28",
    # A real Redis, in process. `RedisStore`'s claim is a single `SET ... NX`,
    # and asserting that it is atomic against a hand-written double would be
    # asserting against my own assumption rather than against Redis.
    "fakeredis>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "../../infra/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "specgate", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "../../infra/scripts"
files = ["app", "tests", "../../infra/scripts/specgate"]

# A pytest test function's signature is fixtures in, nothing out, and annotating
# every one adds noise without adding a check. Everything else stays strict.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
