[project]
name = "jobpilot-api"
version = "0.1.0"
description = "JobPilot API and worker — one image, two entrypoints (ADR-002)."
requires-python = "==3.12.*"
dependencies = [
    # `AUTH-01` §1: "Hashing: Argon2id via `argon2-cffi`, `time_cost=3`,
    # `memory_cost=65536` (64 MiB), `parallelism=1`, 16-byte salt." Named by the
    # requirement, so this is the library rather than a choice.
    "argon2-cffi>=23.1",
    # `FOUND-10` §10: "ARQ on Redis. Worker settings and the cron table in
    # `app/worker.py`, in one place."
    "arq>=0.26",
    "beanie>=1.27",
    "fastapi>=0.115",
    # A *runtime* dependency as of `AUTH-01`, not only a test one.
    #
    # It was in `dependency-groups.dev` for Starlette's `TestClient`, which is an
    # httpx transport. `AUTH-01` §1's breach check is an outbound call to the
    # Pwned Passwords range API from `infra/breaches.py`, so the client now ships
    # in the image. Left in dev only, `uv sync --no-dev` would build an image
    # that imports it and every registration would fail on the first request.
    "httpx>=0.28",
    # The `email` extra pulls `email-validator`, which is what `EmailStr`
    # needs at *import* time - without it `RegisterRequest` raises on class
    # construction, so the failure is a boot failure rather than a bad request.
    # Added with `AUTH-01`, whose input is `RegisterRequest{email, ...}`.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # `FOUND-14` §14: "structlog to stdout, JSON in every environment except
    # local (where it is pretty-printed)."
    "structlog>=24.4",
    # `FOUND-08` §8: "Stored in Redis with a 24 h TTL". The atomic claim is
    # `SET key value NX PX ttl`, which is the entire concurrency argument.
    "prometheus-client>=0.21",
    # `AI-03`/`AI-04` §3.2: "`docs/spec/ai-budget.yaml` - the matrix above in
    # machine-readable form, which parametrizes the degradation tests", and the
    # model-pricing table, which `AC-AI-02.2` forbids writing as `.py` literals.
    # A hand-rolled reader for a nested ten-feature matrix would be a second
    # YAML implementation to keep correct.
    "pyyaml>=6.0",
    # Declared directly, though `beanie` also brings it. Ten modules import it
    # by name - `IndexModel` and `ASCENDING` in every document's `Settings`,
    # `AsyncMongoClient` in `infra/mongo.py`, `AsyncDatabase` in `purge.py` -
    # and a direct import satisfied by somebody else's dependency is a build
    # that breaks when they change theirs. Beanie 2.x uses PyMongo's native
    # async driver, so the version that matters here is the one Beanie pins;
    # this floor only says the API we call exists.
    "pymongo>=4.9",
    "redis>=5.2",
    # `FOUND-14` §14: "Sentry for API, web, and mobile, with `before_send`
    # applying the same redaction list."
    "sentry-sdk>=2.19",
    # `FOUND-11` §11: "SSE via `sse-starlette`. No WebSockets in R1 or R2."
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.32",
]

# Product dependencies are added by the requirement that needs them, never
# speculatively (`01-foundations.md` §1). The spec gates in `tests/spec/` import
# no product code and no third-party library beyond pytest, so they run before
# any of it exists.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "pytest-asyncio>=0.24",
    # `httpx` moved to the runtime dependencies with `AUTH-01` - Starlette's
    # `TestClient` still needs it, and so does `infra/breaches.py`, so declaring
    # it in both places would be two floors to keep in step. See the note there.
    #
    # `T-AUTH-01.2` asserts on the *outbound* request: "the request to the
    # breach service contains only a 5-character hash prefix". That needs the
    # transport intercepted rather than the client mocked - a mocked client
    # asserts what we told it to send, not what would go over the wire, and the
    # criterion is specifically about not leaking the password's full hash.
    "respx>=0.22",
    # A real Redis, in process. `RedisStore`'s claim is a single `SET ... NX`,
    # and asserting that it is atomic against a hand-written double would be
    # asserting against my own assumption rather than against Redis.
    "fakeredis>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.0",
    # Stubs for `pyyaml`, which is a runtime dependency: `ai/budget.py` loads
    # `docs/spec/ai-budget.yaml`, `ai/pricing.py` loads `model-pricing.yaml`,
    # and four spec tests parse the workflow files.
    #
    # Listed here because it was not. It had been installed into the local
    # virtualenv by hand, so `mypy` passed on this machine and failed in CI
    # with "Library stubs not installed for yaml" on every run - `uv sync
    # --frozen` installs the lockfile and nothing else, which is the whole
    # point of `--frozen`. A dependency that exists only in a working copy is
    # a dependency CI does not have.
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "../../infra/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "specgate", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "../../infra/scripts"
# `infra/scripts`, not just `specgate`. The top-level scripts *are* the gate -
# `tasks.py`, `export_openapi.py`, `check_prompt_immutability.py`,
# `ai_nightly_report.py`, `gen_importlinter.py` - and they were checked only
# when a test happened to import one, which is how `ai_nightly_report.py` came
# to use `Any` without importing it and annotate `AsyncMongoClient` with no
# type argument. Tooling nobody type-checks is tooling that breaks the build
# it exists to run.
files = ["app", "tests", "../../infra/scripts"]

# The platform mypy narrows for. Linux, because that is what the product runs
# on - one image, two entrypoints, Docker - and what CI runs on.
#
# Left unset, mypy narrows for whichever machine invokes it, so a Windows
# development machine and a Linux runner check different code. That produced a
# real divergence: `AsyncMongoClient` with no type argument passed locally and
# failed `api-ci` on `mypy`, with the local gate reporting success. Pinning it
# is not a workaround - it is checking the platform the code is deployed to.
platform = "linux"

# A pytest test function's signature is fixtures in, nothing out, and annotating
# every one adds noise without adding a check. Everything else stays strict.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
