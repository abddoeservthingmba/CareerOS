[pytest]
testpaths = tests
python_files = test_*.py
# `-m "not real_ai and not real_source"`: both markers hit a paid third party.
# `05-ai-layer.md` §7 and `06-connectors.md` §5.3 make them nightly-only, and
# the cost of getting this wrong is silent - every developer's `pytest` would
# start spending real money, and the first anyone would know is a bill.
# `nightly-ai.yml` selects them explicitly with `-m real_ai`.
addopts = -q --strict-markers --strict-config -m "not real_ai and not real_source"
asyncio_mode = auto
markers =
    real_ai: hits a real AI provider; nightly only (05-ai-layer.md §7)
    real_source: hits a real job source; nightly only (06-connectors.md §5.3)
